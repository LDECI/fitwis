<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>智动健身助手 - AI 智能问答</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .chat-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 200px);
        min-height: 500px;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 12px;
        margin-bottom: 16px;
        border: 1px solid var(--border-subtle);
      }

      .message {
        margin-bottom: 16px;
        max-width: 85%;
      }

      .message.user {
        margin-left: auto;
        text-align: right;
      }

      .message.assistant {
        margin-right: auto;
      }

      .message-content {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.assistant .message-content {
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid var(--border-subtle);
        border-bottom-left-radius: 4px;
        text-align: left;
      }

      .message.assistant .message-content h1,
      .message.assistant .message-content h2,
      .message.assistant .message-content h3 {
        margin-top: 12px;
        margin-bottom: 8px;
        color: #bbf7d0;
      }

      .message.assistant .message-content ul,
      .message.assistant .message-content ol {
        margin: 8px 0;
        padding-left: 20px;
      }

      .message.assistant .message-content li {
        margin: 4px 0;
      }

      .message.assistant .message-content strong {
        color: #86efac;
      }

      .chat-input-container {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }

      .chat-input {
        flex: 1;
        min-height: 56px;
        max-height: 150px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid var(--border-subtle);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        font-size: 0.95rem;
        resize: vertical;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .chat-input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
      }

      .chat-send-btn {
        padding: 16px 24px;
        border-radius: 16px;
        border: none;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .chat-send-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
      }

      .chat-send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .typing-indicator {
        display: none;
        align-items: center;
        gap: 4px;
        padding: 12px 16px;
        background: rgba(30, 41, 59, 0.9);
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        width: fit-content;
        margin-top: 8px;
      }

      .typing-indicator.active {
        display: flex;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        animation: typing 1.4s infinite;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%, 60%, 100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }

      .nav-links {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .nav-link {
        padding: 10px 20px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-subtle);
        color: var(--text);
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .nav-link:hover {
        background: rgba(34, 197, 94, 0.1);
        border-color: #22c55e;
      }

      .nav-link.active {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        border-color: transparent;
        color: white;
      }

      .user-info-panel {
        background: rgba(15, 23, 42, 0.5);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid var(--border-subtle);
      }

      .user-info-panel h3 {
        margin: 0 0 12px 0;
        font-size: 1rem;
        color: #bbf7d0;
      }

      .user-info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .user-info-item {
        display: flex;
        gap: 6px;
      }

      .user-info-label {
        color: var(--text-muted);
      }

      .user-info-value {
        color: var(--text);
      }

      .suggested-questions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .suggested-question {
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #86efac;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .suggested-question:hover {
        background: rgba(34, 197, 94, 0.2);
        transform: translateY(-1px);
      }

      [data-theme="light"] .suggested-question {
        background: rgba(22, 163, 74, 0.1);
        border-color: rgba(22, 163, 74, 0.3);
        color: #16a34a;
      }

      [data-theme="light"] .suggested-question:hover {
        background: rgba(22, 163, 74, 0.2);
      }

      /* 浅色模式样式 */
      [data-theme="light"] .chat-messages {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
      }

      [data-theme="light"] .message.assistant .message-content {
        background: #f1f5f9;
        border: 1px solid var(--border-subtle);
        color: var(--text);
      }

      [data-theme="light"] .chat-input {
        background: var(--input-bg);
        border: 1px solid var(--border-subtle);
        color: var(--text);
      }

      [data-theme="light"] .typing-indicator {
        background: #f1f5f9;
        border: 1px solid var(--border-subtle);
      }

      [data-theme="light"] .nav-link {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text);
      }

      [data-theme="light"] .nav-link:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      [data-theme="light"] .user-info-panel {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
      }

      [data-theme="light"] .user-info-panel h3 {
        color: var(--accent);
      }

      @media (max-width: 768px) {
        .chat-container {
          height: calc(100vh - 180px);
          min-height: 400px;
        }

        .message {
          max-width: 95%;
        }

        .chat-input-container {
          flex-direction: column;
        }

        .chat-send-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div>
          <h1>智动健身助手</h1>
          <p class="subtitle">AI 智能问答 - 你的专属健身顾问</p>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="切换主题">
          <span class="theme-icon" id="theme-icon">🌙</span>
          <span id="theme-text">深色</span>
        </button>
      </header>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">训练方案生成</a>
        <a href="ai-chat.html" class="nav-link active">AI 智能问答</a>
      </nav>

      <main class="app-main">
        <section class="card">
          <div class="user-info-panel" id="user-info-panel" style="display: none;">
            <h3>当前用户信息</h3>
            <div class="user-info-grid" id="user-info-grid"></div>
          </div>

          <div class="suggested-questions" id="suggested-questions">
            <span class="suggested-question" data-question="如何正确做深蹲？">如何正确做深蹲？</span>
            <span class="suggested-question" data-question="减脂期间应该怎么吃？">减脂期间应该怎么吃？</span>
            <span class="suggested-question" data-question="新手应该从哪里开始？">新手应该从哪里开始？</span>
            <span class="suggested-question" data-question="蛋白质每天需要摄入多少？">蛋白质每天需要摄入多少？</span>
            <span class="suggested-question" data-question="如何避免运动受伤？">如何避免运动受伤？</span>
          </div>

          <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
              <div class="message assistant">
                <div class="message-content">
                  你好！我是你的智动健身助手 🤖💪

我可以帮你解答各种健身问题，包括：
• 训练动作指导和纠正
• 个性化训练计划建议
• 营养和饮食指导
• 恢复和休息建议
• 健身常见问题解答

有什么我可以帮你的吗？
                </div>
              </div>
            </div>

            <div class="chat-input-container">
              <textarea
                class="chat-input"
                id="chat-input"
                placeholder="输入你的健身问题..."
                rows="1"
              ></textarea>
              <button class="chat-send-btn" id="chat-send-btn">发送</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      // API 配置
      const API_BASE_URL = 'http://localhost:5000';

      // 获取 DOM 元素
      const chatMessages = document.getElementById('chat-messages');
      const chatInput = document.getElementById('chat-input');
      const chatSendBtn = document.getElementById('chat-send-btn');
      const userInfoPanel = document.getElementById('user-info-panel');
      const userInfoGrid = document.getElementById('user-info-grid');
      const suggestedQuestions = document.getElementById('suggested-questions');

      // 创建打字指示器元素
      function createTypingIndicator() {
        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.id = 'typing-indicator';
        indicator.innerHTML = `
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        `;
        return indicator;
      }

      // 从 localStorage 获取用户信息
      let userInfo = {};
      try {
        const savedInfo = localStorage.getItem('fitnessUserInfo');
        if (savedInfo) {
          userInfo = JSON.parse(savedInfo);
          displayUserInfo();
        }
      } catch (e) {
        console.log('无法读取用户信息');
      }

      // 显示用户信息
      function displayUserInfo() {
        if (!userInfo || Object.keys(userInfo).length === 0) return;

        const labels = {
          age: '年龄',
          gender: '性别',
          experience: '训练经验',
          daysPerWeek: '每周训练',
          goal: '健身目标',
          place: '训练场景',
          notes: '补充说明'
        };

        const genderMap = { male: '男', female: '女', other: '其他' };
        const experienceMap = {
          beginner: '新手（0-6个月）',
          intermediate: '进阶（6-24个月）',
          advanced: '高阶（2年以上）'
        };
        const goalMap = {
          'fat-loss': '减脂',
          'muscle-gain': '增肌',
          shape: '塑形',
          health: '综合健康'
        };
        const placeMap = {
          gym: '健身房',
          home: '家庭/公园',
          mixed: '两者结合'
        };

        let html = '';
        for (const [key, label] of Object.entries(labels)) {
          if (userInfo[key]) {
            let value = userInfo[key];
            if (key === 'gender') value = genderMap[value] || value;
            if (key === 'experience') value = experienceMap[value] || value;
            if (key === 'goal') value = goalMap[value] || value;
            if (key === 'place') value = placeMap[value] || value;

            html += `
              <div class="user-info-item">
                <span class="user-info-label">${label}:</span>
                <span class="user-info-value">${value}</span>
              </div>
            `;
          }
        }

        if (html) {
          userInfoGrid.innerHTML = html;
          userInfoPanel.style.display = 'block';
        }
      }

      // 添加消息到聊天界面
      function addMessage(content, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.innerHTML = isUser ? escapeHtml(content) : formatMarkdown(content);

        messageDiv.appendChild(contentDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // 转义 HTML
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // 简单的 Markdown 格式化
      function formatMarkdown(text) {
        return text
          .replace(/### (.*)/g, '<h3>$1</h3>')
          .replace(/## (.*)/g, '<h2>$1</h2>')
          .replace(/# (.*)/g, '<h1>$1</h1>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/- (.*)/g, '<li>$1</li>')
          .replace(/\n/g, '<br>');
      }

      // 显示/隐藏打字指示器
      let currentTypingIndicator = null;
      function showTyping(show) {
        chatSendBtn.disabled = show;
        if (show) {
          // 创建并插入打字指示器到消息列表末尾
          currentTypingIndicator = createTypingIndicator();
          currentTypingIndicator.classList.add('active');
          chatMessages.appendChild(currentTypingIndicator);
          chatMessages.scrollTop = chatMessages.scrollHeight;
        } else {
          // 移除打字指示器
          if (currentTypingIndicator) {
            currentTypingIndicator.remove();
            currentTypingIndicator = null;
          }
        }
      }

      // 发送消息
      async function sendMessage(message) {
        if (!message.trim()) return;

        // 添加用户消息
        addMessage(message, true);
        chatInput.value = '';
        chatInput.style.height = 'auto';

        // 显示打字指示器
        showTyping(true);

        try {
          const response = await fetch(`${API_BASE_URL}/api/chat`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: message,
              userInfo: userInfo
            })
          });

          const data = await response.json();

          if (data.success) {
            addMessage(data.response);
          } else {
            addMessage('抱歉，我遇到了一些问题，请稍后再试。错误信息：' + (data.error || '未知错误'));
          }
        } catch (error) {
          console.error('Error:', error);
          addMessage('抱歉，无法连接到服务器，请稍后再试。');
        } finally {
          showTyping(false);
        }
      }

      // 事件监听
      chatSendBtn.addEventListener('click', () => {
        sendMessage(chatInput.value);
      });

      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage(chatInput.value);
        }
      });

      // 自动调整输入框高度
      chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + 'px';
      });

      // 建议问题点击
      suggestedQuestions.addEventListener('click', (e) => {
        if (e.target.classList.contains('suggested-question')) {
          const question = e.target.dataset.question;
          chatInput.value = question;
          sendMessage(question);
        }
      });

      // 页面加载时聚焦输入框
      chatInput.focus();

      // 主题切换功能
      (function() {
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        // 从 localStorage 读取主题设置
        let currentTheme = localStorage.getItem('theme') || 'dark';

        // 应用主题
        function applyTheme(theme) {
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.textContent = '☀️';
            themeText.textContent = '浅色';
          } else {
            document.documentElement.removeAttribute('data-theme');
            themeIcon.textContent = '🌙';
            themeText.textContent = '深色';
          }
          localStorage.setItem('theme', theme);
        }

        // 初始化主题
        applyTheme(currentTheme);

        // 切换主题
        themeToggle.addEventListener('click', () => {
          currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
          applyTheme(currentTheme);
        });
      })();
    </script>
  </body>
</html>
